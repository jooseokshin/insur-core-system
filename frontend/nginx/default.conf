# 브라우저는 이 nginx 하나만 본다(같은 출처). 화면은 정적 파일로, 업무 API 는 내부 서비스로 넘긴다.
#   /api/*  → 코어 백엔드 (core:8080)
#   /auth/* → 인증 서버 (auth:8081)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /auth/ {
        proxy_pass http://auth:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 인증 서버는 이 값으로 로그인 이력의 접속 IP 를 남긴다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 빌드 산출물은 파일명에 해시가 붙으므로 오래 캐시한다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 화면 경로(/contracts/... 등)는 모두 index.html 로 보내 React 라우터가 처리한다. index.html 은 캐시하지 않는다.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
