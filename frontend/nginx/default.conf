# 브라우저는 이 nginx 하나만 본다(같은 출처). 화면은 정적 파일로, 업무 API 는 내부 서비스로 넘긴다.
#   /api/*  → 코어 백엔드 (core:8080)
#   /auth/* → 인증 서버 (auth:8081): OAuth 엔드포인트(/auth/oauth2/*), 로그인 화면(/auth/login), 사원 관리 API
#   /.well-known/* → 인증 서버: OAuth·OIDC 메타데이터 (표준 위치라 /auth 밖에 있다)

# 1단계 호출 제한: 접속 IP 별. 사원별 한도는 코어가 토큰 사번으로 따로 센다(2단계, E-CMN-010).
# 사내 시스템은 여러 직원이 같은 사내 프록시/NAT IP 로 들어오는 경우가 많아서, IP 한도를 사원 한도처럼 낮게 잡으면
# 정상 직원이 함께 막힌다. 그래서 여기 값은 "한 IP 에서 이 이상은 사람이 낼 수 없는" 폭주 상한으로만 둔다.
#   api:   초당 50 (사원 한도 300/분 = 초당 5 를 10명이 동시에 다 써도 통과), 순간 100 까지
#   login: 분당 30, 순간 30 까지. 계정별 5회 잠금은 인증 서버가 하고, 여기서는 한 IP 가 여러 계정을 돌려 찍는 것을 늦춘다.
# 앞에 로드밸런서가 있으면 $binary_remote_addr 가 LB 주소가 되므로 real_ip 설정(set_real_ip_from)을 먼저 맞춰야 한다.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 1m;

    # 한도를 넘으면 화면이 해석할 수 있게 공통 전문 형태로 답한다 (코어의 사원별 제한과 구분되는 코드)
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"header":{"globalTxId":"$request_id","empId":null,"responseCode":"E-CMN-011","responseMsg":"이 접속 위치에서 요청이 너무 많습니다. 잠시 뒤에 다시 시도해 주세요."},"body":null}';
    }

    location /api/ {
        limit_req zone=api_per_ip burst=100 nodelay;
        proxy_pass http://core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /auth/login {
        limit_req zone=login_per_ip burst=30 nodelay;
        proxy_pass http://auth:8081;
        # 로그인 화면 이동 같은 리다이렉트가 브라우저가 보던 출처(포트 포함)를 유지하도록 Host 를 포트까지 넘긴다
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /auth/ {
        limit_req zone=api_per_ip burst=100 nodelay;
        proxy_pass http://auth:8081;
        # 로그인 화면 이동 같은 리다이렉트가 브라우저가 보던 출처(포트 포함)를 유지하도록 Host 를 포트까지 넘긴다
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 인증 서버는 이 값으로 로그인 이력의 접속 IP 를 남긴다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /.well-known/ {
        limit_req zone=api_per_ip burst=100 nodelay;
        proxy_pass http://auth:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 빌드 산출물은 파일명에 해시가 붙으므로 오래 캐시한다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 화면 경로(/contracts/... 등)는 모두 index.html 로 보내 React 라우터가 처리한다. index.html 은 캐시하지 않는다.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
