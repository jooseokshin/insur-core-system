plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.insur'
version = '0.0.1-SNAPSHOT'
description = 'insur-core-system'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 대사·결산 배치 (실행 이력은 DB 의 BATCH_* 표, 스키마는 Flyway 가 만든다)
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // API 문서 (Swagger UI: /swagger-ui.html, 명세: /v3/api-docs)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // 운영과 같은 JVM 시간대(Asia/Seoul)에서 테스트한다. (애플리케이션은 main 에서 기본 시간대를 Asia/Seoul 로 맞춘다)
    systemProperty 'user.timezone', 'Asia/Seoul'
    // JWT 서명 검증용 비밀키 (운영에서는 환경변수로 주입, 테스트용 고정값)
    environment 'JWT_SECRET', 'test-only-secret-key-for-hs256-at-least-32-bytes'
    // 테스트는 같은 사번으로 수백 번 호출하므로 호출 제한을 끈다. 제한 자체는 RateLimitIntegrationTest 가 켜서 확인한다.
    environment 'RATE_LIMIT_ENABLED', 'false'
    // 대외기관 전송 대기열은 테스트가 OutboxSender.sendDue() 를 직접 불러 확인한다 (예약 작업이 끼어들지 않게 끈다)
    environment 'OUTBOX_SCHEDULER_ENABLED', 'false'
    // 일일 대사 예약 실행을 끈다 (배치 테스트가 직접 실행한다). 계좌 암호화 키는 테스트용 공개 값
    environment 'BATCH_SCHEDULER_ENABLED', 'false'
    environment 'ACCOUNT_ENC_KEY', 'ZGV2LW9ubHktYWNjb3VudC1rZXktMzItYnl0ZXMhISE='
}
