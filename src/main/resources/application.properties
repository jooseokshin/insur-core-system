spring.application.name=insur-core-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/insur_core_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.hibernate.ddl-auto=validate

# 토큰 검증. 인증 서버(OAuth 인가 서버)가 RS256 으로 서명한 토큰을 공개키(JWKS)로 검증하고, iss 가 issuer 와 같아야 한다.
# issuer 는 인증 서버의 AUTH_ISSUER 와 같은 값(브라우저가 보는 nginx 주소)이다. 둘 중 하나라도 없으면 아래 비밀키만으로 검증한다.
app.jwt.jwk-set-uri=${JWK_SET_URI:}
app.jwt.issuer=${AUTH_ISSUER:}
# HS256 공유 비밀키(32바이트 이상). 설정했을 때만 HS256 토큰을 받는다. 개발용 토큰(scripts/dev-token.sh)과 테스트용이며 운영에서는 비운다.
# 검증 설정이 하나도 없으면 기동에 실패한다.
app.jwt.secret=${JWT_SECRET:}

# 모든 로그에 거래 ID(MDC: globalTxId)를 붙인다. 요청 밖에서 찍히는 로그는 [-] 로 표시된다.
logging.pattern.level=%5p [%X{globalTxId:--}]

# API 문서(Swagger UI: /swagger-ui.html, 명세: /v3/api-docs). 토큰 없이 열리므로 기본은 꺼 둔다.
# 개발에서는 local 프로파일(application-local.properties)이 켜고, 다른 곳에서 필요하면 API_DOCS_ENABLED=true 로 켠다.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.operations-sorter=alpha

# 사원(토큰 sub)별 호출 제한. 토큰 버킷: capacity 는 한 번에 몰아 보낼 수 있는 수, per-minute 는 분당 다시 차는 수.
# 근거: 화면 하나를 열 때 API 를 1~6번 부른다(계약 상세가 가장 많음). 사람이 2초에 한 화면씩 계속 열어도 분당 약 180번이므로,
# 기본 300/분은 그보다 넉넉하고 스크립트 반복 호출은 막는 값이다. 실제 호출 로그로 다시 맞춘다.
# 서버 메모리에 세므로 서버가 N대면 한도도 N배가 된다(여러 대로 늘리면 RateLimitStore 를 Redis 등으로 바꾼다).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.defaults.capacity=60
app.rate-limit.defaults.per-minute=300
# 전체 계약·사고를 훑는 집계는 따로 낮게 둔다 (탭을 바꿀 때마다 1번)
app.rate-limit.rules[0].name=stats
app.rate-limit.rules[0].paths=/api/stats/**
app.rate-limit.rules[0].capacity=10
app.rate-limit.rules[0].per-minute=20
