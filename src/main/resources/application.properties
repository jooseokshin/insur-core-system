spring.application.name=insur-core-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/insur_core_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.hibernate.ddl-auto=validate

# 토큰 검증. 인증 서버(OAuth 인가 서버)가 RS256 으로 서명한 토큰을 공개키(JWKS)로 검증하고, iss 가 issuer 와 같아야 한다.
# issuer 는 인증 서버의 AUTH_ISSUER 와 같은 값(브라우저가 보는 nginx 주소)이다. 둘 중 하나라도 없으면 아래 비밀키만으로 검증한다.
app.jwt.jwk-set-uri=${JWK_SET_URI:}
app.jwt.issuer=${AUTH_ISSUER:}
# HS256 공유 비밀키(32바이트 이상). 설정했을 때만 HS256 토큰을 받는다. 개발용 토큰(scripts/dev-token.sh)과 테스트용이며 운영에서는 비운다.
# 검증 설정이 하나도 없으면 기동에 실패한다.
app.jwt.secret=${JWT_SECRET:}

# 모든 로그에 거래 ID(MDC: globalTxId)를 붙인다. 요청 밖에서 찍히는 로그는 [-] 로 표시된다.
logging.pattern.level=%5p [%X{globalTxId:--}]

# API 문서(Swagger UI: /swagger-ui.html, 명세: /v3/api-docs). 토큰 없이 열리므로 기본은 꺼 둔다.
# 개발에서는 local 프로파일(application-local.properties)이 켜고, 다른 곳에서 필요하면 API_DOCS_ENABLED=true 로 켠다.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.operations-sorter=alpha

# 사원(토큰 sub)별 호출 제한. 토큰 버킷: capacity 는 한 번에 몰아 보낼 수 있는 수, per-minute 는 분당 다시 차는 수.
# 근거: 화면 하나를 열 때 API 를 1~6번 부른다(계약 상세가 가장 많음). 사람이 2초에 한 화면씩 계속 열어도 분당 약 180번이므로,
# 기본 300/분은 그보다 넉넉하고 스크립트 반복 호출은 막는 값이다. 실제 호출 로그로 다시 맞춘다.
# 서버 메모리에 세므로 서버가 N대면 한도도 N배가 된다(여러 대로 늘리면 RateLimitStore 를 Redis 등으로 바꾼다).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.defaults.capacity=60
app.rate-limit.defaults.per-minute=300
# 규칙은 위에서부터 처음 맞는 하나만 적용한다 (역할을 지정한 규칙은 그 역할의 토큰에만 맞는다).
# 채널·대외기관 시스템(CHANNEL, EXTERNAL)은 고객 여럿의 요청을 토큰 하나(채널 클라이언트 ID)로 보내므로 사원 한도로 막으면 안 된다.
# 이 값은 고객별 공정성이 아니라 채널 쪽 오류(무한 재시도 등)를 끊는 차단기 용도이며, 채널과 합의한 처리량에 맞춰 조정한다.
app.rate-limit.rules[0].name=channel
app.rate-limit.rules[0].roles=CHANNEL,EXTERNAL
app.rate-limit.rules[0].paths=/api/**
app.rate-limit.rules[0].capacity=300
app.rate-limit.rules[0].per-minute=3000
# 전체 계약·사고를 훑는 집계는 따로 낮게 둔다 (탭을 바꿀 때마다 1번)
app.rate-limit.rules[1].name=stats
app.rate-limit.rules[1].paths=/api/stats/**
app.rate-limit.rules[1].capacity=10
app.rate-limit.rules[1].per-minute=20
# 배치 실행·결과 조회도 무거운 작업이라 같은 수준으로 둔다
app.rate-limit.rules[2].name=batch
app.rate-limit.rules[2].paths=/api/batch/**
app.rate-limit.rules[2].capacity=10
app.rate-limit.rules[2].per-minute=20

# 대외기관 연계 (한국신용정보원). mode=simulator 는 모의 기관(TB_SIM_KCIS_*)으로 전문을 주고받는다(개발·테스트).
# 실제 연계는 기관 전용선·VPN 위의 TCP/HTTPS 통로(FepTransport 구현, instCd KCIS)를 따로 만들고 mode 를 바꾼다. org-code 는 기관이 부여한 우리 회사 코드.
app.ext.kcis.mode=${KCIS_MODE:simulator}
app.ext.kcis.org-code=${KCIS_ORG_CODE:K99}
# 전송 대기열(TB_EXT_OUTBOX)을 보내는 주기. 인스턴스가 여럿이어도 FOR UPDATE SKIP LOCKED 로 같은 건을 두 번 보내지 않는다
app.ext.outbox.scheduler-enabled=${OUTBOX_SCHEDULER_ENABLED:true}
app.ext.outbox.interval-ms=${OUTBOX_INTERVAL_MS:10000}

# FEP: 응답 없음이 연속 N번이면 M초 동안 그 기관으로 보내지 않는다(회선 차단). 회선 확인(에코) 주기
app.ext.fep.circuit-failures=${FEP_CIRCUIT_FAILURES:5}
app.ext.fep.circuit-open-seconds=${FEP_CIRCUIT_OPEN_SECONDS:60}
app.ext.fep.echo-interval-ms=${FEP_ECHO_INTERVAL_MS:60000}
# 지급 은행 펌뱅킹. simulator 는 모의 은행(TB_SIM_BANK_*). 실제 연계는 FepTransport 구현(instCd BANK)을 더한다
app.ext.bank.mode=${BANK_MODE:simulator}
# 계좌번호 암호화 키 (Base64 32바이트, AES-256-GCM). 운영은 KMS 등에서 주입한다. 비우면 지급 기능을 쓸 수 없다
app.crypto.account-key=${ACCOUNT_ENC_KEY:}

# 스프링 배치: 실행 이력 표는 Flyway(V27)가 만들고, 앱이 뜰 때 작업을 자동 실행하지 않는다(화면·예약 작업이 실행)
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false
# 일일 지급 대사 예약 (서울 시간 매일 06:30, 전날 것). false 면 예약 실행을 끈다
app.batch.scheduler-enabled=${BATCH_SCHEDULER_ENABLED:true}
app.batch.recon-cron=${BATCH_RECON_CRON:0 30 6 * * *}
