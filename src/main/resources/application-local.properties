# 로컬 개발용 설정. 프로파일 local 일 때만 읽힌다. (IntelliJ: Run 설정의 Active profiles 에 local)
# 이 키는 공개된 개발용 값이라 운영에서 쓰면 안 된다. 운영은 local 프로파일을 켜지 않고, 비밀키 없이 공개키(JWK_SET_URI)로만 검증한다.
# scripts/dev-token.sh 와 scripts/e2e-check.sh 의 개발용 토큰도 같은 값을 쓴다.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-for-local-testing-0123456789}
# 화면 로그인 토큰(RS256)은 로컬 인증 서버(:8081, local 프로파일)의 공개키로 검증한다. issuer 는 개발 서버(vite) 주소다.
app.jwt.jwk-set-uri=${JWK_SET_URI:http://127.0.0.1:8081/auth/oauth2/jwks}
app.jwt.issuer=${AUTH_ISSUER:http://127.0.0.1:5173}

# 개발에서는 API 문서(Swagger UI)를 켠다. 기본은 꺼져 있다. (application.properties)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
