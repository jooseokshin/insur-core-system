// 인증 서버. 플러그인 버전은 루트 build.gradle 의 선언을 따른다.
plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.insur'
version = '0.0.1-SNAPSHOT'
description = 'insur-auth-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // OAuth 2.1 인가 서버(Authorization Code + PKCE, OIDC). 토큰은 RS256 으로 서명하고 공개키를 JWKS 로 내놓는다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
    // 이 서버의 관리 API(/auth/me, /auth/admin/**)는 자기가 발급한 Bearer 토큰으로 호출한다
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // 로그인·비밀번호 변경 화면은 인가 서버가 직접 그린다 (비밀번호는 이 서버 화면에만 입력한다)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // 코어와 같은 업무 시간대(Asia/Seoul)에서 테스트한다.
    systemProperty 'user.timezone', 'Asia/Seoul'
}
