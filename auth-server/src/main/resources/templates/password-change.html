<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('비밀번호 변경 · 손해보험 기간계')}"></head>
<body>
<main class="card">
  <div class="brand">INSUR</div>
  <h1>비밀번호 변경</h1>
  <div class="alert alert-info">임시 비밀번호로 로그인했습니다(<span th:text="${empId}">사번</span>). 업무를 시작하기 전에 새 비밀번호로 바꿔 주세요.</div>
  <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}">오류</div>
  <form method="post" th:action="@{/auth/password-change}">
    <label>현재(임시) 비밀번호
      <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required autofocus>
    </label>
    <label>새 비밀번호
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
    </label>
    <label>새 비밀번호 확인
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
    </label>
    <button type="submit">변경하고 계속</button>
  </form>
  <ul class="notes">
    <li>8~64자, 영문·숫자·특수문자를 모두 넣고 공백 없이</li>
    <li>사번은 넣을 수 없습니다.</li>
  </ul>
</main>
</body>
</html>
