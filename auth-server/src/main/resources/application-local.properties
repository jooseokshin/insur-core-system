# 로컬 개발용 설정. 프로파일 local 일 때만 읽힌다. 운영에서는 local 프로파일을 켜지 않는다.
# 개발 서버(vite, :5173)로 들어오는 화면을 기준으로 issuer 와 돌아갈 주소를 잡는다. 컨테이너(:8088)로 띄울 때도 쓸 수 있게 둘 다 등록한다.
app.oauth.issuer=${AUTH_ISSUER:http://127.0.0.1:5173}
app.oauth.web.redirect-uris=${AUTH_WEB_REDIRECT_URIS:http://127.0.0.1:5173/callback,http://127.0.0.1:8088/callback}
app.oauth.web.post-logout-redirect-uris=${AUTH_WEB_POST_LOGOUT_URIS:http://127.0.0.1:5173/login,http://127.0.0.1:8088/login}

# local 프로파일에서는 개발용 사원 계정(admin01, agent01, agent02, uw01, op01, clm01)을 만든다. (AccountBootstrap.DevAccounts)
# 로그인 화면에도 개발 계정 안내를 띄운다.
app.login.dev-hint=true
