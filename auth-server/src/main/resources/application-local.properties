# 로컬 개발용 설정. 프로파일 local 일 때만 읽힌다. 운영에서는 local 프로파일을 켜지 않는다.
# 개발 서버(vite, :5173)로 들어오는 화면을 기준으로 issuer 와 돌아갈 주소를 잡는다. 컨테이너(:8088)로 띄울 때도 쓸 수 있게 둘 다 등록한다.
app.oauth.issuer=${AUTH_ISSUER:http://127.0.0.1:5173}
app.oauth.web.redirect-uris=${AUTH_WEB_REDIRECT_URIS:http://127.0.0.1:5173/callback,http://127.0.0.1:8088/callback}
app.oauth.web.post-logout-redirect-uris=${AUTH_WEB_POST_LOGOUT_URIS:http://127.0.0.1:5173/login,http://127.0.0.1:8088/login}

# local 프로파일에서는 개발용 사원 계정(admin01, agent01, agent02, uw01, op01, clm01)을 만든다. (AccountBootstrap.DevAccounts)
# 로그인 화면에도 개발 계정 안내를 띄운다.
app.login.dev-hint=true

# 개발용 채널 시스템 클라이언트. 비밀값이 공개된 값이라 운영에서 쓰면 안 된다(운영은 AUTH_CHANNEL_*_SECRET).
# 목록 설정은 프로파일 파일에 한 칸이라도 있으면 목록 전체를 바꾸므로 기본 설정의 항목을 모두 다시 적는다.
# .properties 는 ISO-8859-1 로 읽혀서 한글 값은 \uXXXX 로 적는다 (name: 다이렉트 채널계, TM 채널계)
app.oauth.channels[0].client-id=ch-direct
app.oauth.channels[0].client-secret=${AUTH_CHANNEL_DIRECT_SECRET:dev-only-channel-direct-secret-0123456789}
app.oauth.channels[0].channel-cd=20
app.oauth.channels[0].name=\ub2e4\uc774\ub809\ud2b8 \ucc44\ub110\uacc4
app.oauth.channels[1].client-id=ch-tm
app.oauth.channels[1].client-secret=${AUTH_CHANNEL_TM_SECRET:dev-only-channel-tm-secret-0123456789ab}
app.oauth.channels[1].channel-cd=30
app.oauth.channels[1].name=TM \ucc44\ub110\uacc4
app.oauth.partners[0].client-id=kidi-relay
app.oauth.partners[0].client-secret=${AUTH_PARTNER_KIDI_SECRET:dev-only-partner-kidi-secret-0123456789}
app.oauth.partners[0].name=\ubcf4\ud5d8\uac1c\ubc1c\uc6d0 \uc2e4\uc190 \uccad\uad6c \uc911\uacc4
