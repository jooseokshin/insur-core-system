# 로컬 개발용 설정. 프로파일 local 일 때만 읽힌다.
# 코어 백엔드의 application-local.properties 와 같은 공개 개발용 키라서, 둘 다 local 로 띄우면 이 서버의 토큰을 코어가 받아들인다.
# 운영에서는 local 프로파일을 켜지 않고 JWT_SECRET 환경변수로 두 서버에 같은 값을 주입한다.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-for-local-testing-0123456789}

# local 프로파일에서는 개발용 사원 계정(admin01, agent01, agent02, uw01, op01)을 만든다. (DevAccountSeeder)
