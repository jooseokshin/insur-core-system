spring.application.name=insur-auth-server
server.port=${AUTH_PORT:8081}

# 코어와 같은 PostgreSQL 의 별도 스키마(auth)를 쓴다. 운영에서는 AUTH_DB_URL 로 별도 DB 를 가리킬 수 있다.
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/insur_core_db?currentSchema=auth}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgrespassword}

# 스키마가 없으면 Flyway 가 만들고, 이력 테이블도 auth 스키마에 둔다. (코어의 public 스키마 이력과 섞이지 않는다)
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT(HS256) 서명 비밀키. 코어 백엔드와 같은 값이어야 코어가 이 서버의 토큰을 받아들인다. 기본값이 없어 설정하지 않으면 기동에 실패한다.
app.jwt.secret=${JWT_SECRET}
# 발급 토큰 유효시간(분). 사용 중지·역할 변경은 다음 로그인부터 반영되므로 너무 길게 두지 않는다.
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
app.jwt.issuer=insur-auth-server
# 비밀번호를 연속으로 이 횟수만큼 틀리면 계정을 잠근다
app.login.max-failures=5

# 최초 기동 시 사원이 한 명도 없으면 이 비밀번호로 admin 계정을 만든다(첫 로그인 때 변경 필수). 비워 두면 만들지 않는다.
app.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# nginx 같은 프록시 뒤에서 X-Forwarded-For 의 원래 접속 IP 를 로그인 이력에 남긴다. 프록시를 거치지 않고 직접 노출하면 끈다.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

logging.pattern.level=%5p [%X{globalTxId:--}]
