spring.application.name=insur-auth-server
server.port=${AUTH_PORT:8081}

# 코어와 같은 PostgreSQL 의 별도 스키마(auth)를 쓴다. 운영에서는 AUTH_DB_URL 로 별도 DB 를 가리킬 수 있다.
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/insur_core_db?currentSchema=auth}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgrespassword}

# 스키마가 없으면 Flyway 가 만들고, 이력 테이블도 auth 스키마에 둔다. (코어의 public 스키마 이력과 섞이지 않는다)
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# OAuth 2.1 인가 서버. issuer 는 브라우저가 보는 주소(nginx 출처)이고, 토큰의 iss 와 코어의 검증 값이 이것과 같아야 한다.
# 엔드포인트는 nginx 가 이 서버로 넘기는 /auth 아래에 둔다: /auth/oauth2/authorize, /auth/oauth2/token, /auth/oauth2/jwks,
# /auth/oauth2/revoke, /auth/userinfo, /auth/connect/logout. 메타데이터만 표준 위치(/.well-known/...)에 있다.
app.oauth.issuer=${AUTH_ISSUER:http://127.0.0.1:8088}
# 액세스 토큰 유효시간(분). 사용 중지·역할 변경은 다음 토큰 발급부터 반영되므로 너무 길게 두지 않는다.
app.oauth.access-token-ttl-minutes=${JWT_TTL_MINUTES:60}
# 화면(SPA) 클라이언트. 비밀값이 없는 공개 클라이언트라 PKCE 가 필수이고, 아래 주소로만 돌려보낸다.
# 인가 서버는 돌아갈 주소에 localhost 를 허용하지 않는다(OAuth 2.1 보안 권고: 루프백은 127.0.0.1 처럼 IP 로). 그래서 개발 주소도 127.0.0.1 이다.
app.oauth.web.client-id=insur-web
app.oauth.web.redirect-uris=${AUTH_WEB_REDIRECT_URIS:http://127.0.0.1:8088/callback}
app.oauth.web.post-logout-redirect-uris=${AUTH_WEB_POST_LOGOUT_URIS:http://127.0.0.1:8088/login}
# 토큰 서명용 RSA 개인키(PKCS#8 PEM 본문). 비우면 기동할 때마다 새로 만들므로 재기동하면 이전 토큰이 모두 무효가 되고
# 서버를 여러 대 띄울 수 없다. 운영에서는 반드시 AUTH_SIGNING_KEY 로 주입한다.
app.oauth.signing-key=${AUTH_SIGNING_KEY:}
# 로그인 세션(인가 서버 화면용). 이 시간 동안 다시 로그인하지 않고 토큰을 새로 받는다(SSO). 화면의 로그아웃은 이 세션도 끝낸다.
server.servlet.session.timeout=${AUTH_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=INSUR_AUTH_SESSION
server.servlet.session.cookie.path=/auth
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 로그인 화면 이동 같은 리다이렉트를 상대 주소로 보낸다. 프록시가 Host 의 포트를 빼도 브라우저가 보던 출처로 돌아간다.
server.tomcat.use-relative-redirects=true

# 비밀번호를 연속으로 이 횟수만큼 틀리면 계정을 잠근다
app.login.max-failures=5

# 최초 기동 시 사원이 한 명도 없으면 이 비밀번호로 admin 계정을 만든다(첫 로그인 때 변경 필수). 비워 두면 만들지 않는다.
app.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# nginx 같은 프록시 뒤에서 X-Forwarded-For 의 원래 접속 IP 를 로그인 이력에 남긴다. 프록시를 거치지 않고 직접 노출하면 끈다.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

logging.pattern.level=%5p [%X{globalTxId:--}]
